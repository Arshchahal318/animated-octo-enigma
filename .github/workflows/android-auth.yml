name: ArriveTogether signed-in Android checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-native-auth
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify released APK
        id: release
        run: python3 harness/release.py
      - name: Verify encrypted QA secrets are configured
        env:
          QA_EMAIL_1: ${{ secrets.QA_EMAIL_1 }}
          QA_PASSWORD_1: ${{ secrets.QA_PASSWORD_1 }}
          QA_EMAIL_2: ${{ secrets.QA_EMAIL_2 }}
          QA_PASSWORD_2: ${{ secrets.QA_PASSWORD_2 }}
        run: python3 -c "import os; assert all(os.environ.get(k) for k in ['QA_EMAIL_1','QA_PASSWORD_1','QA_EMAIL_2','QA_PASSWORD_2']), 'Encrypted QA secrets are not configured'"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test APK on Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          APK_SHA256: ${{ steps.release.outputs.sha }}
          APK_VERSION: ${{ steps.release.outputs.version }}
          QA_EMAIL_1: ${{ secrets.QA_EMAIL_1 }}
          QA_PASSWORD_1: ${{ secrets.QA_PASSWORD_1 }}
          QA_EMAIL_2: ${{ secrets.QA_EMAIL_2 }}
          QA_PASSWORD_2: ${{ secrets.QA_PASSWORD_2 }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 private-harness/native_auth.py
      - name: Save sanitized native status only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-native-auth-status
          path: test-results/native-auth.json
          retention-days: 1
          if-no-files-found: warn
  publish:
    needs: android
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-native-auth-status
          path: test-results
      - name: Publish sanitized native status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 private-harness/publish_auth.py
